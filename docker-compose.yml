services:
  postgres:
    image: postgres:16-alpine
    container_name: texforge-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-texforge}
      POSTGRES_USER: ${POSTGRES_USER:-texforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-texforge_password}
    volumes:
      - texforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-texforge_user} -d ${POSTGRES_DB:-texforge}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  texforge-postgres-data:
    name: texforge-postgres-data
