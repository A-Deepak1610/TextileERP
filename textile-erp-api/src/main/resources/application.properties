spring.application.name=textile-erp-api

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:texforge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 15 minutes (900,000 ms)
jwt.access-token-expiration-ms=90000000
# 7 days (604,800,000 ms)
jwt.refresh-token-expiration-ms=604800000

# GST RapidAPI Integration Configuration
gst.rapidapi.key=${GST_RAPIDAPI_KEY:0004fce178msh522802d606b6a19p1a0d89jsn6ea48e2820d2}
gst.rapidapi.host=${GST_RAPIDAPI_HOST:gst-return-status.p.rapidapi.com}
gst.rapidapi.url=${GST_RAPIDAPI_URL:https://gst-return-status.p.rapidapi.com/free/gstin/}
gst.rapidapi.timeout-ms=5000
